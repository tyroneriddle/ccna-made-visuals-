<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Spanning tree, directed by hand</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;

  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}

.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}

.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}

.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}

.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(680px,100% - 32px);margin:64px auto 96px}

ing → learning → forwarding (watch the amber LEDs) before he waves traffic onto the backup bridge. Repair it and the tree flips back. Every LED, gesture and readout line is driven by the same port-state model.</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];
    for (const [cx, cy, start] of corners) {
        const count = radius > 0 ? steps : 0;
        for (let step = 0; step <= count; step++) {
            const angle = (start + (count ? (90 * step) / count : 45)) * RADIANS;
            out.push([cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)]);

}
function signedArea(points) {
    let area = 0;
    for (let index = 0; index < points.length; index++) {
        const [ax, ay] = points[index];

}
const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);
function convexHull(points) {
    const sorted = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);

        return sorted;

    const lower = [];
    for (const point of sorted) {
        while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], point) <= 0)

        lower.push(point);
    }
    const upper = [];
    for (let index = sorted.length - 1; index >= 0; index--) {

        while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], point) <= 0)
            upper.pop();
        upper.push(point);
    }
    return [...lower.slice(0, -1), ...upper.slice(0, -1)];
}
function runsOf(flags, want) {

    const start = flags.findIndex((flag, index) => flag !== flags[(index + count - 1) % count]);

    let run = null;
    for (let step = 0; step < count; step++) {
        const index = (start + step) % count;

            if (!run)

function extrude(ring, z, height, projection, options = {}) {
    const convex = options.convex ?? true;
    const count = ring.length;

function sideOf(meridian) {
  const m = meridian.length;
  let first = 0;
  let last = m - 1;

  if (meridian[m - 1][1] <= 1e-9) last = m - 2;
  const side = meridian.slice(first, last + 1);
  for (let index = 1; index < side.length; index++) if (side[index][0] - side[index - 1][0] <= 1e-9) return null;
  return side.length >= 3 ? side : null;

function surfaceOf(side, F, P, rims, { samples = 96, slope = null } = {}) {

  const r1 = side[side.length - 1][1];
  const bottom = -aV > 0 ? facing + Math.PI : facing;
  const top = aV > 0 ? facing + Math.PI : facing;
  const L = left.map((point) => iso(point, P));
  const R = right.map((point) => iso(point, P));
  const topArc = arc(s1, r1, angleOf(left[left.length - 1]), angleOf(right[right.length - 1]), top);
  const bottomArc = arc(s0, r0, angleOf(right[0]), angleOf(left[0]), bottom);

  const keepLast = rims === "all" || rims === "last" || rims === "ends";

  const outline = [pathOf(L), pathOf(R), keepLast ? pathOf(topArc) : "", keepFirst ? pathOf(bottomArc) : ""].join("");

    for (let index = 0; index < hull.length; index++) {
      const a = hull[index];

      const dx = b[0] - a[0];
      const dy = b[1] - a[1];

const softOf = (meridian) => meridian.some((point) => Boolean(point[2]));

function lathe(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, bevel = 0, rims = "all", smooth: asked = "auto", waist = 0.5 } = {}) {

    fill: fillPath,
    outline,
    crease: creases.join(""),
    top: buckets[4].join(""),
    shades: buckets.slice(0, 4).map((list) => list.join("")),

function shapeOf(meridian, P, smooth) {

    const segments = meridian.slice(0, -1).map(([s0], index) => (Math.abs(meridian[index + 1][0] - s0) > 1e-9 ? { radius: smooth.radius, slope: smooth.slope } : null));

function outlineOf(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, rims = "all", smooth: asked = "auto", waist = 0.5, all = null } = {}) {

const signedArea = (points) => points.reduce((sum, [x, y], index) => {
  const [nx, ny] = points[(index + 1) % points.length];

const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);

const saddleStart = (R, a, angle) => Math.sqrt(Math.max(0, R * R - a * a * Math.cos(angle) ** 2));

  for (let j = 0; j < n; j++) {

    tones.push(bandOf(dot3(normal, L)));

    fills.push(d);

    fills.push(d);

function prismOf(F, polygon, s0, s1, P) {

    const { shapes, put, A } = rep(CX);
    const out = [];
    fn(out, { shapes, put, A });
    parts.push({ name, at, svg: out.join(""), shapes });
  };
  part("stand.base", [0, 0, -7], (out, { shapes, put, A }) => {
    out.push(`<path class="iso-halo" d="${haloOf(PLATE, -19, 19, P)}"/>`);
    for (const [fx, fy] of corners(PLATE, 26)) {
      out.push(S(cylinder(fx, fy, 7, -19, 5, P, 28), { tone: "lo" }));
      if (A) put(A.cylinder(fx, fy, 7, -19, 5, { name: "stand.foot" }));
    }
    out.push(S(slabOf(PLATE, -14, 14, P, 10, 1.2), { tone: "mid" }));
    if (A) put(A.slab(PLATE, -14, 14, { name: "stand.plate" }, 10));
    out.push(lineSvg(planOutline(insetPlan(PLATE, 6), 0, P), { tone: "faint" }));
    const screws = corners(PLATE, 14);
    out.push(lineSvg(screws.map(([x, y]) => ring(x, y, 2.2, 0, P, 16)).join(""), { tone: "lo" }));
    out.push(dotsSvg(screws.map(([x, y]) => iso([x, y, 0], P)), { size: 0.5 }));
  });
  part("stand.grass", [0, 0, 0.25], (out, { shapes, put, A }) => {
    for (const [g, n] of [[GRASS_W, "stand.grassW"], [GRASS_E, "stand.grassE"]]) {
      out.push(S(slabOf(g, 0, 0.5, P, 6), { tone: "hi", flat: true, className: "paint-grass" }));
      if (A) put(A.slab(g, 0, 0.5, { name: n }, 6));
    }
  });
  part("stand.water", [0, 0, 0.35], (out, { shapes, put, A }) => {
    out.push(S(slabOf(WATER, 0, 0.7, P, 4), { tone: "hi", flat: true, className: "paint-water" }));
    if (A) put(A.slab(WATER, 0, 0.7, { name: "stand.water" }, 4));
    for (const [px, py] of [[-18, YP], [18, YP], [-18, YB], [18, YB]]) {
      const pts = [];
      for (let i = 0; i <= 12; i++) {
        const a = Math.PI * (1.15 + (i / 12) * 0.7);
        pts.push(iso([px + 7.5 * Math.cos(a), py + 7.5 * Math.sin(a), 0.72], P));
      }
      out.push(fadeLineSvg(pts, { fade: [7, 7], tone: "blue", stops: 6 }));
    }
  });
  const roadDashes = {
    wp: () => dashesH(P, -154, -52, YP, ROAD_TOP),
    wb: () => dashesH(P, -154, -52, YB, ROAD_TOP),
    ep: () => dashesH(P, 52, 154, YP, ROAD_TOP),
    eb: () => dashesH(P, 52, 154, YB, ROAD_TOP),
    wc: () => lineSvg(lineOnTop([-98, -48], [-98, 48], ROAD_TOP, P), { tone: "lo", dashed: true, className: "dash" }),
    ec: () => lineSvg(lineOnTop([98, -48], [98, 48], ROAD_TOP, P), { tone: "lo", dashed: true, className: "dash" }),
  };
  for (const { n, p } of ROADS) {
    part(`road.${n}`, [p.x + p.w / 2, p.y + p.d / 2, 1], (out, { shapes, put, A }) => {
      out.push(S(slabOf(p, 0.5, 1, P, 4, 0.4), { tone: "lo" }));
      if (A) put(A.slab(p, 0.5, 1, { name: `road.${n}` }, 4));
      out.push(roadDashes[n]());
    });
  }
  for (const sgn of [-1, 1]) {
    const tag = sgn < 0 ? "W" : "E";
    const bx = sgn < 0 ? -186 : 166;
    part(`stand.depot${tag}`, [bx + 10, -60, 3], (out, { shapes, put, A }) => {
      const box = { x: bx, y: -70, w: 20, d: 20, r: 2 };
      const roof = { x: bx - 2, y: -72, w: 24, d: 24, r: 2 };
      out.push(S(slabOf(box, 0.5, 6.5, P, 6, 0.6), { tone: "mid" }));
      out.push(S(slabOf(roof, 7, 1.2, P, 6, 0.4), { tone: "hi" }));
      if (A) {
        put(A.slab(box, 0.5, 6.5, { name: `stand.depot${tag}` }, 6));
        put(A.slab(roof, 7, 1.2, { name: `stand.depotRoof${tag}` }, 6));
      }
      const door = { x: sgn < 0 ? -166.3 : 165.3, y: -65, w: 1.0, d: 10, r: 0.5 };
      out.push(S(slabOf(door, 0.5, 5, P, 3), { tone: "hi", className: "paint-dark" }));
      if (A) put(A.slab(door, 0.5, 5, { name: `stand.depotDoor${tag}` }, 3));
    });
  }
  part("stand.label", [-145, -98.5, 1], (out, { shapes, put, A }) => {
    const label = { x: -178, y: -106, w: 66, d: 15, r: 2 };
    out.push(S(slabOf(label, 0.5, 1, P, 4), { tone: "hi" }));
    if (A) put(A.slab(label, 0.5, 1, { name: "stand.label" }, 4));
    out.push(lineSvg(planOutline(insetPlan(label, 2.5), 1.5, P, 4), { tone: "faint" }));
    out.push(faceTextSvg(topMatrix([-145, -98.5], 1.5, P, "x"), "STP-1 · SPANNING TREE", { size: 3.1, tone: "lo", anchor: "middle" }));
  });
  part("stand.ruler", [120, -103, 0.4], (out, { shapes, put, A }) => {
    const strip = { x: 60, y: -106, w: 120, d: 6, r: 1 };
    out.push(S(slabOf(strip, 0, 0.8, P, 3), { tone: "lo", crease: "none" }));
    if (A) put(A.slab(strip, 0, 0.8, { name: "stand.ruler" }, 3));
    const ticks = topTicks(strip.x + 4, strip.x + strip.w - 4, 4, 5, strip.y + 0.8, 0.8, [1.8, 3.2], P);
    out.push(lineSvg(ticks.minor, { tone: "lo" }), lineSvg(ticks.major, { tone: "mid" }));
  });
  return parts;
}

/* ---------------- bridges ---------------- */
const yOf = (id) => (id === "P" ? YP : YB);

function drawBridgeStatic(P, id, CX) {
  const { shapes, put, A } = rep(CX);
  const Y = yOf(id);
  const out = [];
  for (const px of [-18, 18]) {
    out.push(S(cylinder(px, Y, 5, 0.5, DECK_BOT - 0.5, P, 28), { tone: "mid" }));
    if (A) put(A.cylinder(px, Y, 5, 0.5, DECK_BOT - 0.5, { name: `bridge.${id}.pier${px < 0 ? "W" : "E"}` }));
  }
  for (const ax of [-47, 40]) {
    const ab = { x: ax, y: Y - 8, w: 7, d: 16, r: 1 };
    out.push(S(slabOf(ab, 0.3, 2.2, P, 4, 0.4), { tone: "mid" }));
    if (A) put(A.slab(ab, 0.3, 2.2, { name: `bridge.${id}.abut${ax < 0 ? "W" : "E"}` }, 4));
  }
  // brass id plate on the west abutment's viewer-facing (+y) face
  const plate = { x: -46.4, y: Y + 8, w: 5.6, d: 0.5, r: 0.2 };
  out.push(S(slabOf(plate, 1, 1.1, P, 2), { tone: "hi", className: "paint-brass" }));
  if (A) put(A.slab(plate, 1, 1.1, { name: `bridge.${id}.plate` }, 2));
  out.push(
    faceTextSvg(sideMatrix([-43.6, Y + 8.55], 1.55, P, "left"), id === "P" ? "P · ROOT" : "B", {
      size: 1.7,
      tone: "lo",
      anchor: "middle",
    }),
  );
  // barrier post + pivot housing (the arm itself is the animated item)
  const [bx, by] = pivotOf(id);
  out.push(S(cylinder(bx, by, 1.1, 0.3, 7.2, P, 20), { tone: "hi" }));
  out.push(S(cylinder(bx, by, 1.5, 7.5, 0.8, P, 20), { tone: "mid" }));
  if (A) {
    put(A.cylinder(bx, by, 1.1, 0.5, 7, { name: `barrier.${id}.post` }));
    put(A.cylinder(bx, by, 1.5, 7.5, 0.8, { name: `barrier.${id}.housing` }));
  }
  // striped warning bollard opposite the post, across the road
  const wy = id === "P" ? -68 : 68;
  const wx = id === "P" ? bx : -40;
  out.push(S(cylinder(wx, wy, 0.9, 0.3, 5.7, P, 18), { tone: "hi", className: "paint-barrier" }));
  if (A) put(A.cylinder(wx, wy, 0.9, 0.3, 5.7, { name: `barrier.${id}.bollard` }));
  out.push(S(cylinder(wx, wy, 0.95, 5.5, 0.5, P, 18), { tone: "hi", className: "paint-white" }));
  if (A) put(A.cylinder(wx, wy, 0.95, 5.5, 0.5, { name: `barrier.${id}.bollardCap` }));
  return { svg: out.join(""), shapes };
}

function drawDeck(P, id, CX) {
  const { shapes, put, A } = rep(CX);
  const Y = yOf(id);
  const out = [];
  const deck = { x: -40, y: Y - 7, w: 80, d: 14, r: 1 };
  out.push(S(slabOf(deck, DECK_BOT, DECK_TOP - DECK_BOT, P, 8, 0.6), { tone: "hi" }));
  if (A) put(A.slab(deck, DECK_BOT, DECK_TOP - DECK_BOT, { name: `bridge.${id}.deck` }, 8));
  const dg = [];
  for (let x = -34; x < 34; x += 8) dg.push(lineSvg(lineOnTop([x, Y], [x + 4, Y], DECK_TOP, P), { tone: "lo", className: "dash" }));
  out.push(dg.join(""));
  return { svg: out.join(""), shapes };
}

function drawRailing(P, id, CX) {
  const { shapes, put, A } = rep(CX);
  const Y = yOf(id);
  const out = [];
  for (let x = -36; x <= 36; x += 12)
    for (const ry of [Y - 5.6, Y + 5.6]) {
      out.push(S(cylinder(x, ry, 0.7, DECK_TOP, 3, P, 14), { tone: "mid" }));
      if (A) put(A.cylinder(x, ry, 0.7, DECK_TOP, 3, { name: `bridge.${id}.post${x}_${ry < Y ? "S" : "N"}` }));
    }
  for (const ry of [Y - 6.6, Y + 5.3]) {
    const rail = { x: -40, y: ry, w: 80, d: 1.3, r: 0.6 };
    out.push(S(slabOf(rail, 7, 0.9, P, 4, 0.3), { tone: "hi" }));
    if (A) put(A.slab(rail, 7, 0.9, { name: `bridge.${id}.rail${ry < Y ? "S" : "N"}` }, 4));
  }
  return { svg: out.join(""), shapes };
}

function drawCrack(P, id) {
  const Y = yOf(id);
  const pts = [
    [7, Y - 5.5],
    [3.5, Y - 2.5],
    [7.5, Y + 0.5],
    [4, Y + 3],
    [6.5, Y + 5.5],
  ];
  let d = "";
  for (let i = 0; i < pts.length - 1; i++) d += lineOnTop(pts[i], pts[i + 1], DECK_TOP + 0.05, P);
  return lineSvg(d, { tone: "red", className: "crack" });
}

/* Pivot per bridge: P's post stands north of its road, B's south. */
const pivotOf = (id) => (id === "P" ? [-52, -52, 8.9] : [-52, 52, 8.9]);
/* Live rotation sign so the arm swings UP from the pivot: P's arm points -y,
 * B's +y; rotXMatrix(+ang) sends +y to +z, so P needs a negative angle. */
const barrierDir = (id) => (id === "P" ? -1 : 1);

/* Barrier arm: one red prism reaching horizontally across the road from the
 * pivot bolt, with painted white stripe diagonals on its ±x faces.
 * Drawn in the DOWN (blocking) pose; the live page rotates it up when open. */
function drawBarrierArm(P, id, CX) {
  const { shapes, put, A } = rep(CX);
  const out = [];
  const [bx, by, bz] = pivotOf(id);
  const ay = id === "P" ? -1 : 1; // arm reaches across the road
  const F = frameAlong([bx, by, bz], [0, ay, 0]); // axis along ±y, section in x-z
  const crossPoly = [
    [-0.8, -0.55],
    [0.8, -0.55],
    [0.8, 0.55],
    [-0.8, 0.55],
  ];
  const armP = prismOf(F, crossPoly, 0.7, 13, P);
  out.push(S(armP, { tone: "mid", className: "paint-barrier" }));
  if (A) put(A.prism(F, crossPoly, 0.7, 13, { name: `barrier.${id}.arm` }));
  // painted stripes: diagonal white lines on the ±x faces
  for (const vc of [3.4, 6.9, 10.4]) {
    const y0 = by + ay * (vc - 1.2), y1 = by + ay * (vc + 1.2);
    for (const sx of [0.81, -0.81]) {
      out.push(
        lineSvg(segment([bx + sx, y0, bz - 0.4], [bx + sx, y1, bz + 0.4], P), {
          tone: "lo",
          className: "stripe",
        }),
      );
    }
  }
  const bolt = sphereOf(pivotOf(id), 1, P, { steps: 24 });
  out.push(S(bolt, { tone: "hi" }));
  if (A) put(A.ball(pivotOf(id), 1, { name: `barrier.${id}.bolt` }));
  return { svg: out.join(""), shapes };
}

/* ---------------- the cop ---------------- */
const COP = [-52, 76];
const RS = [-55.4, 76, 12.5]; // right shoulder ball centre (sign arm)
const LS = [-48.6, 76, 12.5]; // left shoulder ball centre

/* A limb between two joint centres. The prism stops `insetA`/`insetB` short of
 * each joint so its end caps stay inside the joint balls without sinking deep. */
function limbSeg(P, a, b, r, name, out, rp, insetA, insetB) {
  const ia = insetA === undefined ? 0.7 : insetA;
  const ib = insetB === undefined ? 0.7 : insetB;
  const d = [b[0] - a[0], b[1] - a[1], b[2] - a[2]];
  const len = Math.hypot(d[0], d[1], d[2]) || 1;
  const F = frameAlong(a, d);
  const poly = oct(r, 0);
  out.push(S(prismOf(F, poly, ia, len - ib, P), { tone: "mid" }));
  if (rp.A) rp.put(rp.A.prism(F, poly, ia, len - ib, { name }));
}
function jointBall(P, c, r, name, out, rp) {
  out.push(S(sphereOf(c, r, P, { steps: 24 }), { tone: "mid" }));
  if (rp.A) rp.put(rp.A.ball(c, r, { name }));
}

function drawCopPad(P, CX) {
  const { shapes, put, A } = rep(CX);
  const out = [];
  out.push(`<path class="iso-halo" d="${haloOf({ x: COP[0] - 9, y: COP[1] - 9, w: 18, d: 18, r: 9 }, 1.2, 0.1, P)}" style="filter:blur(4px)"/>`);
  out.push(S(cylinder(COP[0], COP[1], 9, 0.3, 0.9, P, 40), { tone: "lo" }));
  if (A) put(A.cylinder(COP[0], COP[1], 9, 0.3, 0.9, { name: "cop.pad" }));
  out.push(lineSvg(ring(COP[0], COP[1], 7.2, 1.2, P, 40), { tone: "faint" }));
  return { svg: out.join(""), shapes };
}

/* M: { sign (1 raised .. 0 lowered), gesture: block|listen|learn|wave|idle, waveT, time } */
function drawCop(P, M, CX) {
  const rp = rep(CX);
  const { shapes } = rp;
  const out = [];
  const low = 1 - M.sign;
  // boots, legs, torso, vest, belt
  for (const bx of [-53.7, -50.3]) {
    const boot = { x: bx - 1.3, y: 74.6, w: 2.6, d: 2.8, r: 0.6 };
    out.push(S(slabOf(boot, 1.2, 1.2, P, 3), { tone: "hi", className: "paint-dark" }));
    if (rp.A) rp.put(rp.A.slab(boot, 1.2, 1.2, { name: `cop.boot${bx < -52 ? "L" : "R"}` }, 3));
    out.push(S(cylinder(bx, 76, 1.05, 2.4, 5.1, P, 18), { tone: "mid" }));
    if (rp.A) rp.put(rp.A.cylinder(bx, 76, 1.05, 2.4, 5.1, { name: `cop.leg${bx < -52 ? "L" : "R"}` }));
  }
  // torso as a flush stack: shirt, belt, shirt, hi-vis vest band, shirt
  const stack = [
    [7.5, 8.4, 2.7, "hi", null, "torsoLo"],
    [8.4, 9.1, 2.72, "hi", "paint-dark", "belt"],
    [9.1, 9.5, 2.7, "hi", null, "torsoMid"],
    [9.5, 12.5, 2.72, "hi", "paint-vest", "vest"],
    [12.5, 13.5, 2.7, "hi", null, "torsoHi"],
  ];
  for (const [z0, z1, r, tone, cls, n] of stack) {
    out.push(S(cylinder(-52, 76, r, z0, z1 - z0, P, 28), { tone, className: cls || undefined }));
    if (rp.A) rp.put(rp.A.cylinder(-52, 76, r, z0, z1 - z0, { name: `cop.${n}` }));
  }
  // shoulder balls ride 0.3 proud of the torso surface
  jointBall(P, RS, 1.0, "cop.shoulderR", out, rp);
  jointBall(P, LS, 1.0, "cop.shoulderL", out, rp);
  // right arm (sign arm): drawn before torso (far side)
  const elbowR = lerp3([-57.6, 76, 15.6], [-56.2, 76, 10.2], low);
  const handR = lerp3([-58.9, 76, 19.2], [-55.7, 76, 8.6], low);
  limbSeg(P, RS, elbowR, 0.9, "cop.armR.upper", out, rp);
  limbSeg(P, elbowR, handR, 0.85, "cop.armR.fore", out, rp);
  jointBall(P, elbowR, 1.0, "cop.elbowR", out, rp);
  jointBall(P, handR, 1.05, "cop.handR", out, rp);
  // head, cap, brim
  out.push(S(sphereOf([-52, 76, 15.3], 2.1, P, { steps: 32 }), { tone: "hi" }));
  if (rp.A) rp.put(rp.A.ball([-52, 76, 15.3], 2.1, { name: "cop.head" }));
  out.push(S(cylinder(-52, 76, 2.3, 17.1, 1.2, P, 24), { tone: "hi", className: "paint-dark" }));
  if (rp.A) rp.put(rp.A.cylinder(-52, 76, 2.3, 17.1, 1.2, { name: "cop.cap" }));
  out.push(S(cylinder(-52, 75.3, 2.9, 16.95, 0.25, P, 24), { tone: "hi", className: "paint-dark" }));
  if (rp.A) rp.put(rp.A.cylinder(-52, 75.3, 2.9, 16.95, 0.25, { name: "cop.brim" }));
  // left arm by gesture
  let elbowL, handL;
  const g = M.gesture;
  if (g === "listen") {
    elbowL = [-47.5, 75.8, 12.0];
    handL = [-49.15, 76, 15.3];
  } else if (g === "learn") {
    const beck = Math.sin((M.time || 0) * 9) * 1.2;
    elbowL = [-49.3, 73.4, 11.4];
    handL = [-49.3, 70.4 + beck, 12.3];
  } else if (g === "wave") {
    const ph = ((M.waveT || 0) % 0.9) / 0.9;
    const tri = ph < 0.5 ? ph * 2 : 2 - ph * 2;
    elbowL = lerp3([-49.3, 73.6, 11.9], [-46.2, 69.8, 12.9], tri);
    handL = lerp3([-49.3, 71.8, 12.4], [-43.8, 66.8, 13.6], tri);
  } else {
    elbowL = [-48.4, 76, 9.8];
    handL = [-48.2, 76, 7.2];
  }
  limbSeg(P, LS, elbowL, 0.9, "cop.armL.upper", out, rp);
  limbSeg(P, elbowL, handL, 0.85, "cop.armL.fore", out, rp);
  jointBall(P, elbowL, 1.0, "cop.elbowL", out, rp);
  jointBall(P, handL, 1.05, "cop.handL", out, rp);
  // STOP sign: rigid with the right hand — pole runs hand -> mounting bolt
  // just under the sign's bottom rim
  const signC = [handR[0], handR[1], handR[2] + 8.6];
  const boltC = [handR[0], handR[1], signC[2] - 4.38];
  jointBall(P, boltC, 0.7, "cop.signBolt", out, rp);
  limbSeg(P, handR, boltC, 0.5, "cop.pole", out, rp);
  const F = frameAlong(signC, [1, 0, 0]); // u=+y, v=+z ; faces point +-x
  const poly = oct(4.2, Math.PI / 8);
  out.push(S(prismOf(F, poly, -0.6, 0.6, P), { tone: "mid", className: "paint-sign" }));
  if (rp.A) rp.put(rp.A.prism(F, poly, -0.6, 0.6, { name: "cop.sign" }));
  // white rim on both faces
  for (const s of [1, -1]) {
    const pts = oct(3.4, Math.PI / 8).map(([u, v]) => iso([signC[0] + s * 0.62, signC[1] + u, signC[2] + v], P));
    out.push(lineSvg(pathOf(pts, true), { tone: "lo", className: "sign-rim" }));
  }
  // STOP text on both faces. sideMatrix "right" advances text along world -y,
  // which reads correctly on the -x face (cars' side) and mirrored on the +x
  // face (viewer side), so the viewer side gets an inner scale(-1,1).
  const textOn = (s, flip) => {
    const m = sideMatrix([signC[0] + s * 0.65, signC[1]], signC[2], P, "right");
    const t = `<text class="iso-face-text" font-size="2.9" text-anchor="middle" dy="1">STOP</text>`;
    return `<g class="sign-text"><g transform="${m}">${flip ? `<g transform="matrix(-1 0 0 1 0 0)">${t}</g>` : t}</g></g>`;
  };
  out.push(textOn(1, true));
  out.push(textOn(-1, false));
  return { svg: out.join(""), shapes };
}

/* ---------------- cars ---------------- */
function drawCar(P, car, CX) {
  const rp = rep(CX);
  const out = [];
  const { x, y, z, h, paint } = car;
  const f = [Math.cos(h), Math.sin(h)];
  const r = [f[1], -f[0]];
  const W = (lx, ly) => [x + f[0] * lx + r[0] * ly, y + f[1] * lx + r[1] * ly];
  const cls = `paint-car${paint}`;
  for (const [lx, ly] of [[3.4, 2.9], [3.4, -2.9], [-3.4, 2.9], [-3.4, -2.9]]) {
    const [wx, wy] = W(lx, ly);
    out.push(S(cylinder(wx, wy, 1.4, z, 1.6, P, 18), { tone: "hi", className: "paint-dark" }));
    if (rp.A) rp.put(rp.A.cylinder(wx, wy, 1.4, z, 1.6, { name: `car${paint}.wheel${lx > 0 ? "F" : "R"}${ly > 0 ? "R" : "L"}` }));
  }
