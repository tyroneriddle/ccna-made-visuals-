<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>NAT/PAT: the office mailroom</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(980px,100% - 32px);margin:64px auto 96px}

</div></div><figcaption class="iso-legend"><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Letters are packets — watch the return address get rewritten</span><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Wall ledger is the NAT table: one PO box, many apartment numbers</span></span><span class="iso-caption">A corporate mailroom that works exactly like NAT with port translation. Four desks hold private inside addresses (10.0.0.2–10.0.0.5) no outsider can route to; the whole office shares one public PO box, 203.0.113.7. Click a desk and its employee hands the clerk a letter for the outside world: the clerk writes a row in the wall ledger — inside extension and port on the left, the PO box plus a fresh apartment number (the port, assigned from 1024 up) in the middle, the outside destination on the right — then stamps the letter with the public return address and drops it in the OUT slot. When the reply comes back to “PO box 203.0.113.7, apartment 1025”, the clerk looks the apartment number up in the ledger and the trolley carries it to the right desk; the row ages out once the call is done. Two desks can share the one box at the same time — that is the PAT punchline: the apartment number is what tells the replies apart.</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)

    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],

    const out = [];

        for (let step = 0; step <= count; step++) {

const CFG = {"publicIp":"203.0.113.7","inside":["10.0.0.2","10.0.0.3","10.0.0.4","10.0.0.5"],"outside":[["198.51.100.9",80],["198.51.100.23",443],["198.51.100.41",25],["198.51.100.77",53]],"portStart":1024};
const P = {"origin":[473.8683861563375,390.38695735756323],"scale":1.6461005585596797,"azimuth":42,"elevation":30};
const DESKX = [-118,-42,34,110];
const ROWS = 5;
const CLERK_X = -97;
const RAIL_Y = -20, TRAVEL_Z = 54, HOOK_Z = 41;
const PARK = [[-141,-66.5,41],[-141,-64.9,41],[-141,-63.3,41],[-141,-61.7,41]];
const SLOT_OUT = [-19,-82,58];
const SLOT_IN = [65,-84,22];
const PUB = CFG.publicIp;
const CLERK_HAND = [CLERK_X, -70, 42];

const ease = (t) => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const lerp = (a, b, t) => a + (b - a) * t;
const lerp3 = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const nearT = (a, b) => Math.abs(a - b) < 0.6;
const wp = (pts, k) => {
  const n = pts.length - 1, f = Math.min(Math.max(k, 0), 0.999999) * n, i = Math.floor(f);
  return lerp3(pts[i], pts[i + 1], f - i);
};

const stage = document.querySelector(".iso-stage");
const svgEl = stage.querySelector("svg");
const readout = document.querySelector("[data-readout]");
const tbody = document.querySelector("[data-ledger-body]");
const still = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

const trolleyEl = svgEl.querySelector('[data-part="trolley"]');
const stampEl = svgEl.querySelector('[data-part="stamp"]');
let trolleyX = CLERK_X, trolleyTarget = CLERK_X;

const letters = [0, 1, 2, 3].map((i) => {
  const el = svgEl.querySelector('[data-letter="' + i + '"]');
  return { el: el, l1: el.querySelector("[data-l1]"), l2: el.querySelector("[data-l2]"), busy: false, park: PARK[i] };
});
const setPos = (L, p) => L.el.setAttribute("transform", translateAlong(P, p));
const setLabel = (L, a, b) => { L.l1.textContent = a; L.l2.textContent = b; };
const parkLetter = (L) => { L.busy = false; L.el.style.opacity = 1; setPos(L, L.park); };

const rowEls = [];
for (let r = 0; r < ROWS; r++) {
  rowEls.push({
    ins: document.getElementById("lr" + r + "i"),
    glo: document.getElementById("lr" + r + "g"),
    out: document.getElementById("lr" + r + "o"),
    flash: document.getElementById("lr" + r + "f"),
  });
}
const rowFree = [];
for (let r = 0; r < ROWS; r++) rowFree.push(true);
const entries = [];
let nextPort = CFG.portStart, freePorts = [], seq = 0;
const allocPort = () => { freePorts.sort((a, b) => a - b); return freePorts.length ? freePorts.shift() : nextPort++; };

const queue = [];
let active = null, frame = 0, last = 0, visible = false, tourT = 0, idleT = 99;

const statusText = (e) =>
  ({ queued: "queued", writing: "writing…", await: "awaiting reply", inbound: "routing reply", done: "delivered ✓" })[e.state] || e.state;

function updateLedgerUI() {
  let html = "";
  for (const e of entries) {
    html += "<tr><td>" + e.inside + ":" + e.iport + "</td><td>" + PUB + ":" + e.pport +
      "</td><td>" + e.o[0] + ":" + e.o[1] + "</td><td>" + statusText(e) + "</td></tr>";
  }
  if (!html) html = '<tr><td colspan="4" class="nat-empty">ledger is empty — click a desk to place an outside call</td></tr>';
  tbody.innerHTML = html;
  const n = entries.length;
  const txt = n === 0 ? "idle · PO box " + PUB : n + " active translation" + (n > 1 ? "s" : "") + " · PO box " + PUB;
  if (readout.textContent !== txt) readout.textContent = txt;
}

function takeRow(e) {
  if (e.row < 0) { e.row = rowFree.indexOf(true); rowFree[e.row] = false; }
  return rowEls[e.row];
}
function typeRow(e, k) {
  const r = takeRow(e);
  const a = e.inside + ":" + e.iport, b = PUB + ":" + e.pport, c = e.o[0] + ":" + e.o[1];
  r.ins.textContent = a.slice(0, Math.ceil(a.length * k));
  r.glo.textContent = b.slice(0, Math.ceil(b.length * k));
  r.out.textContent = c.slice(0, Math.ceil(c.length * k));
}
function flashRow(e, k) {
  const r = rowEls[e.row];
  r.flash.setAttribute("opacity", k < 1 ? (0.25 + 0.25 * Math.sin(k * 18)).toFixed(2) : 0);
}
function clearRow(e) {
  if (e.row < 0) return;
  const r = rowEls[e.row];
  r.ins.textContent = ""; r.glo.textContent = ""; r.out.textContent = "";
  r.flash.setAttribute("opacity", 0);
  rowFree[e.row] = true; e.row = -1;
}

function placeCall(emp) {
  if (typeof emp !== "number") emp = Math.floor(Math.random() * 4);
  if (entries.length >= ROWS) return;
  const L = letters.find((l) => !l.busy);
  if (!L) return;
  idleT = 0;
  const o = CFG.outside[seq % CFG.outside.length];
  const e = {
    id: ++seq, emp: emp, inside: CFG.inside[emp],
    iport: 49152 + Math.floor(Math.random() * 16383),
    pport: allocPort(), o: o, state: "queued", row: -1,
    stamped: false, relabeled: false, timer: 0,
  };
  entries.push(e);
  L.busy = true;
  L.el.style.opacity = 1;
  setLabel(L, e.inside + ":" + e.iport, "→ " + o[0] + ":" + o[1]);
  setPos(L, [DESKX[emp], 52, 33]);
  const hx = DESKX[emp];
  const phases = [
    { dur: 0.6, update: function () { trolleyTarget = hx; }, done: function () { return nearT(trolleyX, hx); } },
    { dur: 1.1, update: function (k) { setPos(L, wp([[hx, 52, 33], [hx, 52, TRAVEL_Z], [hx, RAIL_Y, TRAVEL_Z], [hx, RAIL_Y, HOOK_Z]], k)); } },
    { dur: 1.2, update: function () { trolleyTarget = CLERK_X; setPos(L, [trolleyX, RAIL_Y, HOOK_Z]); }, done: function () { return nearT(trolleyX, CLERK_X); } },
    { dur: 0.7, update: function (k) { setPos(L, lerp3([CLERK_X, RAIL_Y, HOOK_Z], CLERK_HAND, k)); } },
    { dur: 1.8, update: function (k) { e.state = "writing"; typeRow(e, k); }, end: function () { updateLedgerUI(); } },
    { dur: 0.8, update: function (k) {
        const dz = k < 0.4 ? -9 * (k / 0.4) : -9 * (1 - (k - 0.4) / 0.6);
        stampEl.setAttribute("transform", translateAlong(P, [0, 0, still ? 0 : dz]));
        if (k > 0.45 && !e.stamped) { e.stamped = true; setLabel(L, PUB + ":" + e.pport, "→ " + o[0] + ":" + o[1]); }
      }, end: function () { stampEl.setAttribute("transform", translateAlong(P, [0, 0, 0])); } },
    { dur: 0.9, update: function (k) { setPos(L, lerp3(CLERK_HAND, SLOT_OUT, k)); L.el.style.opacity = 1 - k; },
      end: function () { parkLetter(L); e.state = "await"; updateLedgerUI(); scheduleReply(e); } },
  ];
  queue.push({ phases: phases, i: 0, t: 0 });
  updateLedgerUI();
  pump();
}

function scheduleReply(e) {
  e.timer = setTimeout(function () {
    if (e.state !== "await") return;
    e.state = "inbound";
    updateLedgerUI();
    queue.push(inboundMission(e));
    pump();
  }, 2600 + Math.random() * 2600);
}

function inboundMission(e) {
  const L = letters.find((l) => !l.busy) || letters[0];
  L.busy = true;
  L.el.style.opacity = 1;
  setLabel(L, e.o[0] + ":" + e.o[1], "→ " + PUB + ":" + e.pport);
  setPos(L, SLOT_IN);
  const hx = DESKX[e.emp];
  const phases = [
    { dur: 0.8, update: function (k) { setPos(L, lerp3(SLOT_IN, [65, -68, 34], k)); } },
    { dur: 0.7, update: function (k) { setPos(L, lerp3([65, -68, 34], [65, -68, 46], k)); } },
    { dur: 0.9, update: function (k) { setPos(L, lerp3([65, -68, 46], [-97, -70, 46], k)); } },
    { dur: 0.6, update: function (k) { setPos(L, lerp3([-97, -70, 46], CLERK_HAND, k)); } },
    { dur: 1.3, update: function (k) { flashRow(e, k);
        if (k > 0.5 && !e.relabeled) { e.relabeled = true; setLabel(L, PUB + ":" + e.pport, "→ " + e.inside + ":" + e.iport); } } },
    { dur: 0.5, update: function () { trolleyTarget = CLERK_X; }, done: function () { return nearT(trolleyX, CLERK_X); } },
    { dur: 1.0, update: function (k) { setPos(L, wp([CLERK_HAND, [-97, -70, TRAVEL_Z], [-97, RAIL_Y, TRAVEL_Z], [-97, RAIL_Y, HOOK_Z]], k)); } },
    { dur: 1.2, update: function () { trolleyTarget = hx; setPos(L, [trolleyX, RAIL_Y, HOOK_Z]); }, done: function () { return nearT(trolleyX, hx); } },
    { dur: 0.6, update: function (k) { setPos(L, lerp3([hx, RAIL_Y, HOOK_Z], [hx, RAIL_Y, TRAVEL_Z], k)); } },
    { dur: 0.7, update: function (k) { setPos(L, lerp3([hx, RAIL_Y, TRAVEL_Z], [hx + 20, RAIL_Y, TRAVEL_Z], k)); } },
    { dur: 0.8, update: function (k) { setPos(L, lerp3([hx + 20, RAIL_Y, TRAVEL_Z], [hx + 20, 39, 38], k)); L.el.style.opacity = 1 - k; },
      end: function () { parkLetter(L); e.state = "done"; updateLedgerUI();
        setTimeout(function () { removeEntry(e); }, 3200); } },
  ];
  return { phases: phases, i: 0, t: 0 };
}

function removeEntry(e) {
  clearTimeout(e.timer);
  clearRow(e);
  freePorts.push(e.pport);
  const ix = entries.indexOf(e);
  if (ix >= 0) entries.splice(ix, 1);
  updateLedgerUI();
}

function resetAll() {
  for (const e of entries) { clearTimeout(e.timer); clearRow(e); }
  entries.length = 0; queue.length = 0; active = null;
  freePorts = []; nextPort = CFG.portStart; seq = 0;
  for (const L of letters) parkLetter(L);
  trolleyTarget = CLERK_X;
  updateLedgerUI();
}

const pump = () => { if (!frame && visible) { last = 0; frame = requestAnimationFrame(tick); } };
function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  idleT += dt;
  if (!still) {
    trolleyX += (trolleyTarget - trolleyX) * (1 - Math.exp(-dt / 0.45));
    if (Math.abs(trolleyTarget - trolleyX) < 0.05) trolleyX = trolleyTarget;
  } else { trolleyX = trolleyTarget; }
  trolleyEl.setAttribute("transform", translateAlong(P, [trolleyX - CLERK_X, 0, 0]));
  if (!active) active = queue.shift() || null;
  if (active) {
    const ph = active.phases[active.i];
    active.t += dt;
    const raw = ph.dur ? Math.min(active.t / ph.dur, 1) : 1;
    ph.update(still ? 1 : ease(raw));
    if ((still || active.t >= ph.dur) && (!ph.done || ph.done())) {
      if (ph.end) ph.end();
      active.i++; active.t = 0;
      if (active.i >= active.phases.length) active = null;
    }
  }
  tourT += dt;
  if (tourT > 6) { tourT = 0; if (!still && entries.length < 2 && idleT > 4) placeCall(); }
  frame = visible ? requestAnimationFrame(tick) : 0;
}

svgEl.querySelectorAll("[data-desk]").forEach((g) => {
  g.style.cursor = "pointer";
  g.addEventListener("click", () => placeCall(Number(g.getAttribute("data-desk"))));
});
document.querySelector('[data-act="call"]').addEventListener("click", () => placeCall());
document.querySelector('[data-act="reset"]').addEventListener("click", resetAll);
stage.addEventListener("keydown", (ev) => {
  if (ev.key >= "1" && ev.key <= "4") placeCall(Number(ev.key) - 1);
  else if (ev.key === " ") { ev.preventDefault(); placeCall(); }
});
new IntersectionObserver((es) => { visible = es[es.length - 1].isIntersecting; if (visible) pump(); }, { rootMargin: "120px 0px" }).observe(stage);
updateLedgerUI();
setTimeout(() => placeCall(1), 900);
setTimeout(() => placeCall(3), 2900);
